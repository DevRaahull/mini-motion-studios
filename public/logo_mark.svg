<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED59B" />
      <stop offset="50%" stop-color="#D6B36A" />
      <stop offset="100%" stop-color="#9E7C35" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(50,50)" filter="url(#goldGlow)">
    <!-- Central diamond / star petals -->
    <path d="M 0,-40 C 4,-20 12,-12 30,-30 C 12,-12 20,-4 40,0 C 20,4 12,12 30,30 C 12,12 4,20 0,40 C -4,20 -12,12 -30,30 C -12,12 -20,4 -40,0 C -20,-4 -12,-12 -30,-30 C -12,-12 -4,-20 0,-40 Z" fill="url(#goldGrad)" />
    <!-- Secondary diagonal petals -->
    <g transform="rotate(45)">
      <path d="M 0,-28 C 3,-14 9,-9 22,-22 C 9,-9 14,-3 28,0 C 14,3 9,9 22,22 C 9,9 3,14 0,28 C -3,14 -9,9 -22,22 C -9,9 -14,3 -28,0 C -14,-3 -9,-9 -22,-22 C -9,-9 -3,-14 0,-28 Z" fill="url(#goldGrad)" opacity="0.85" />
    </g>
    <!-- Center circle and jewel facet -->
    <circle cx="0" cy="0" r="6" fill="#0B1220" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="0" cy="0" r="2.5" fill="url(#goldGrad)" />
  </g>
</svg>
